<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- iOS no acepta SVG en `apple-touch-icon`: con el SVG, "Agregar a inicio" en iPhone se
         inventaba una miniatura de la página en vez de usar el icono. Tiene que ser PNG. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- `viewport-fit=cover` + los safe-area del CSS para que en teléfonos con notch la app llegue
         hasta los bordes sin que la barra de estado tape contenido. Se deja el zoom con los dedos
         habilitado a propósito (no se fija maximum-scale): bloquearlo es un problema de accesibilidad. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#991b1b" />
    <!-- iOS ignora el manifest para esto: sin estas dos, "Agregar a inicio" abre la app dentro de
         Safari con su barra de direcciones en vez de a pantalla completa. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="facturAI" />
    <title>facturAI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
